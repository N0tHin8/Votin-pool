<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - LAN E-Vote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl">
    <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition inline-flex items-center gap-1.5 mb-6">
      <i class="fa-solid fa-arrow-left"></i> Back to Main Portal
    </a>

    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 mx-auto flex items-center justify-center text-2xl mb-3 shadow-inner">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Admin Portal</h2>
      <p class="text-xs text-slate-400 mt-1">Election Control & Token Activation Console</p>
    </div>

    <!-- Feedback Banner -->
    <div id="errorBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="errorMessage"></span>
    </div>

    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
            <i class="fa-solid fa-user-shield"></i>
          </span>
          <input type="text" id="username" required autocomplete="off" placeholder="admin"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
            <i class="fa-solid fa-key"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 mt-2">
        <span>Enter Admin Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="mt-6 text-center text-[11px] text-slate-400">
      <i class="fa-solid fa-shield-halved text-indigo-400 mr-1"></i> Authorized election administrators only.
    </div>
  </div>

  <script>
    const adminLoginForm = document.getElementById('adminLoginForm');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Login failed');
        }

        window.location.href = '/admin';
      } catch (err) {
        errorMessage.innerText = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
